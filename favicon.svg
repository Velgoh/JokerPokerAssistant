<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#cardGrad)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Inner Border -->
  <rect x="7" y="7" width="50" height="50" rx="10" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Central Joker Character / Suit Emblem -->
  <text x="32" y="44" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif">🃏</text>
</svg>
